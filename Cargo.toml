[package]
name = "folio"
version = "0.1.0"
edition = "2024"
description = "Folio: classify research links, images and notes by project. Part of the FalseAvarn suite."
publish = false

[dependencies]
eframe = "0.37"
egui_extras = { version = "0.37", features = ["file", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
